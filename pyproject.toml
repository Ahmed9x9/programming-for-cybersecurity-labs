[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cys403-programming-for-cybersecurity-labs"
version = "1.0.0"
description = "Clean Python solutions for CYS 403 Programming for Cybersecurity labs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ahmed Al-Shaikh" }]
dependencies = [
    "scapy==2.6.1",
    "shodan==1.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[tool.setuptools.packages.find]
include = ["labs*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
